name: Swing screener

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours, a few minutes after each completed 4H crypto candle (UTC).
    - cron: '7 */4 * * *'

permissions:
  contents: read

concurrency:
  group: swing-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-screener.txt
      - run: python -m pip install -r requirements-screener.txt
      # The journal and baselines must persist so later scans can confirm signals.
      # A repository cache keeps the private journal out of the committed tree.
      - name: Restore screener state
        uses: actions/cache/restore@v4
        with:
          path: .screener/live
          key: screener-live-${{ github.run_id }}
          restore-keys: screener-live-
      - name: Scan stocks and crypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADDITIONAL_CHAT_IDS: ${{ secrets.TELEGRAM_ADDITIONAL_CHAT_IDS }}
        run: |
          notify=''
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then notify='--notify'; fi
          python -m screener once $notify | tee scan.log
          {
            echo '## Swing screener scan'
            echo '```'
            cat scan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save screener state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .screener/live
          key: screener-live-${{ github.run_id }}
      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-dashboard
          path: .screener/live/public
          retention-days: 7
